name: Kafka plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # Windows runners default python stdout to cp1252; the smoke script prints
  # Unicode (→, ✓) and would die on UnicodeEncodeError. UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/validate_repo.py
      - run: node scripts/connection-forms/verify.mjs kafka

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      # setup-node 的 pnpm 缓存需要 pnpm 已在 PATH 中，故置于 pnpm/action-setup 之后
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Committed ui/ output is fresh
        run: |
          if ! git diff --quiet -- ui/; then
            git diff --stat -- ui/
            echo "ui/ is stale: run 'pnpm --dir frontend build' and commit the output" >&2
            exit 1
          fi

  backend:
    name: Go sidecar checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      # Module downloads need the network; go.sum pins every version. The
      # vendored SDK (shared/sdk/go/dbx-plugin-sdk) is resolved through the
      # backend/go.mod replace, no host checkout required.
      - run: (cd backend && go vet ./... && go test ./...)

  candidate:
    name: Package candidate (${{ matrix.target }})
    needs: [validate, frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
            python: python3
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
            python: python3
          - os: macos
            runner: macos-15
            target: darwin-arm64
            python: python3
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
            python: python3
          - os: windows
            runner: windows-2022
            target: windows-x64
            python: python
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      # Warm the module/download caches once so build.sh's go build and the
      # CLI's own rebuild of the sidecar both run offline-fast.
      - name: Pre-download Go modules
        run: (cd backend && go mod download)
      - run: pnpm --dir frontend install --frozen-lockfile
      # Install the CLI before build.sh: its packaging step calls the native
      # plugin-cli directly (resolve_native_plugin_cli).
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      # build.sh runs the frontend three-step, builds the sidecar into
      # backend/bin (local smoke target) and packages the .dbxp via the native
      # plugin-cli for the running platform, with DBX_PLUGIN_TARGET steering
      # the cross-compile.
      - name: Build and package candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          NO_COLOR: "1"
        run: bash scripts/build.sh
      - name: Offline MCP smoke
        run: |
          SIDECAR="$PWD/backend/bin/dbx-plugin-kafka"
          [ -f "$SIDECAR.exe" ] && SIDECAR="$SIDECAR.exe"
          DBX_PLUGIN_SIDECAR="$SIDECAR" ${{ matrix.python }} scripts/smoke_mcp.py
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-kafka-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  candidates-check:
    name: Cross-target candidate checks
    needs: [candidate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-kafka-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/check_candidates.py dist --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64
